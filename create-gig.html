<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakGig - Create a Gig</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white border-b border-gray-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold text-emerald-700 tracking-tight">Pak<span class="text-gray-900">Gig</span></a>
            <div class="flex items-center gap-5 text-sm font-medium text-gray-600">
                <a href="Services.html" class="hover:text-emerald-700">Services</a>
                <a href="dashboard.html" class="hover:text-emerald-700">Dashboard</a>
                <a href="profile.html" class="hover:text-emerald-700">Profile</a>
                <a href="login.html" data-logout class="hover:text-red-600">Logout</a>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 py-8 space-y-6">
        <div>
            <h1 class="text-xl font-bold text-gray-900">Create a New Gig</h1>
            <p class="text-xs text-gray-500 mt-1">List a service buyers can order with escrow protection.</p>
        </div>

        <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8">
            <form id="gigForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Gig title</label>
                    <input type="text" id="title" required minlength="3" maxlength="120" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="e.g. I will build a business website">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Category</label>
                    <select id="category" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                        <option value="web">Web &amp; App Development</option>
                        <option value="design">Graphics &amp; Design</option>
                        <option value="seo">Digital Marketing / SEO</option>
                        <option value="architecture">Architecture &amp; Architectural Design</option>
                        <option value="writing">Writing &amp; Translation</option>
                        <option value="video">Video &amp; Animation</option>
                        <option value="ai">AI &amp; Data Entry</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Description</label>
                    <textarea id="description" rows="5" maxlength="2000" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none resize-none" placeholder="Tell buyers what they will get..."></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Price (Rs.)</label>
                        <input type="number" id="price" required min="100" max="10000000" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Minimum Rs. 100">
                        <p id="feeHint" class="text-[11px] text-gray-500 mt-1">PakGig takes an 8% platform fee from every order.</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Delivery time (days)</label>
                        <input type="number" id="deliveryDays" required min="1" max="90" value="7" class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" id="saveBtn" class="px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition disabled:opacity-60 disabled:cursor-not-allowed">Publish gig</button>
                    <a href="dashboard.html" class="px-6 py-2.5 border border-gray-300 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-50 transition">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
import { requireLogin, bindLogout } from "./js/session.js";
import { getMyProfile, createGig } from "./js/data.js";
import { money, feeFor, payoutFor } from "./js/ledger.js";

bindLogout();

const $ = (id) => document.getElementById(id);

function showAlert(type, msg) {
    const styles = type === "success"
        ? "bg-emerald-50 border-emerald-200 text-emerald-800"
        : "bg-red-50 border-red-200 text-red-800";
    const box = $("alertBox");
    box.className = "p-3 rounded-lg text-xs font-medium border block " + styles;
    box.textContent = msg;
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function friendlyGigError(err) {
    const m = (err && err.message ? err.message : "").toLowerCase();
    if (m.includes("sellers_only")) return "Only seller accounts can create gigs.";
    if (m.includes("account_suspended")) return "Your account is suspended, so you can't create gigs.";
    if (m.includes("not_authenticated")) return "Please log in again.";
    if (m.includes("kyc_required")) return "Complete your KYC first (kyc.html), then publish your gig.";
    return "Could not publish your gig. Check the details and try again.";
}

// Live preview of the 8% fee for the price the seller types.
$("price").addEventListener("input", () => {
    const p = Number($("price").value);
    $("feeHint").textContent = p > 0
        ? "PakGig fee (8%): " + money(feeFor(p)) + "  ·  You receive: " + money(payoutFor(p))
        : "PakGig takes an 8% platform fee from every order.";
});

requireLogin().then(async (res) => {
    let profile = { role: "buyer" };
    try { profile = await getMyProfile(res.user); } catch (e) {}

    if (profile.role !== "seller" && profile.role !== "admin") {
        $("gigForm").classList.add("hidden");
        showAlert("error", "Only seller accounts can create gigs. Sign up with a seller account to list your services.");
    }
});

$("gigForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const saveBtn = $("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Publishing...";

    try {
        await createGig({
            title: $("title").value.trim(),
            description: $("description").value.trim(),
            category: $("category").value,
            price: Number($("price").value),
            deliveryDays: Number($("deliveryDays").value)
        });
        showAlert("success", "Your gig is live. Taking you to the services page...");
        setTimeout(() => { window.location.href = "Services.html"; }, 1200);
    } catch (err) {
        showAlert("error", friendlyGigError(err));
        saveBtn.disabled = false;
        saveBtn.textContent = "Publish gig";
    }
});
    </script>
</body>
</html>
