<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakGig - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* Keep the page inside the phone screen: nothing may push the page wider than the screen */
        html, body { max-width: 100%; overflow-x: clip; }
        img, svg, video { max-width: 100%; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-12 px-4">

    <div class="max-w-md w-full min-w-0 space-y-6 bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <!-- Logo -->
        <div class="text-center space-y-2">
            <a href="index.html" class="text-3xl font-extrabold text-emerald-700 tracking-tight inline-block">Pak<span class="text-gray-900">Gig</span></a>
            <h2 class="text-xl font-bold text-gray-900">Welcome back</h2>
            <p class="text-xs text-gray-500">Sign in to manage your orders & escrow funds</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium border"></div>

        <!-- Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="name@example.com">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-gray-700">Password</label>
                    <button type="button" id="forgotBtn" class="text-xs text-emerald-700 hover:underline disabled:opacity-60 disabled:cursor-not-allowed">Forgot password?</button>
                </div>
                <input type="password" id="loginPassword" required class="w-full px-3.5 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="••••••••">
            </div>

            <button type="submit" id="loginBtn" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold rounded-lg shadow-md transition">
                Sign In
            </button>
        </form>

        <div class="text-center text-xs text-gray-600">
            Don't have a PakGig account? <a href="signup.html" class="font-semibold text-emerald-700 hover:underline">Join Free</a>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-gray-400 hover:text-gray-600">← Back to Home Page</a>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./js/supabaseClient.js";
        import { friendlyAuthError } from "./js/session.js";

        const DEFAULT_REASON = "violation of our Terms & Conditions";
        function suspendedMsg(reason) {
            return "Your account has been suspended due to " + (reason || DEFAULT_REASON) + ". If you believe this is a mistake, please contact pakgig.support@gmail.com.";
        }

        const alertBox = document.getElementById("alertBox");
        const loginBtn = document.getElementById("loginBtn");
        const forgotBtn = document.getElementById("forgotBtn");
        const emailInput = document.getElementById("loginEmail");
        const passwordInput = document.getElementById("loginPassword");

        function showAlert(type, message) {
            const styles = type === "success"
                ? "bg-emerald-50 border-emerald-200 text-emerald-800"
                : "bg-red-50 border-red-200 text-red-800";
            alertBox.className = "p-3 rounded-lg text-xs font-medium border block " + styles;
            alertBox.textContent = message;
        }

        // A suspended user who was signed out by another page lands here.
        if (new URLSearchParams(window.location.search).get("suspended") === "1") {
            let savedReason = null;
            try { savedReason = sessionStorage.getItem("pakgigSuspendedReason"); sessionStorage.removeItem("pakgigSuspendedReason"); } catch (e) {}
            showAlert("error", suspendedMsg(savedReason));
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            loginBtn.disabled = true;
            loginBtn.textContent = "Authenticating...";
            alertBox.className = "hidden";

            const email = emailInput.value.trim();
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: passwordInput.value
            });

            if (error) {
                const text = String(error.message || "").toLowerCase();
                if (text.includes("banned")) {
                    // The account is suspended: look up the reason the admin chose.
                    let reason = null;
                    try {
                        const res = await supabase.rpc("suspension_notice", { p_email: email });
                        reason = res && res.data ? res.data : null;
                    } catch (err) {}
                    showAlert("error", suspendedMsg(reason));
                } else {
                    showAlert("error", friendlyAuthError(error.message));
                }
                loginBtn.disabled = false;
                loginBtn.textContent = "Sign In";
                return;
            }

            // Admins go straight to the admin panel. KYC is mandatory for
            // everyone else: without an approved KYC they go to verification.
            // (Admin pages re-check the role in the database, so this redirect
            // is only a convenience, not a security check.)
            let next = "Services.html";
            try {
                const { data: profile } = await supabase
                    .from("profiles").select("role, kyc_status, status, suspension_reason")
                    .eq("id", data.user.id).single();
                if (profile && profile.status === "suspended") {
                    await supabase.auth.signOut();
                    showAlert("error", suspendedMsg(profile.suspension_reason));
                    loginBtn.disabled = false;
                    loginBtn.textContent = "Sign In";
                    return;
                }
                if (profile && profile.role === "admin") {
                    next = "admin.html";
                } else if (profile && profile.kyc_status !== "approved") {
                    next = "kyc.html";
                }
            } catch (err) { /* fall back to Services.html; pages gate KYC themselves */ }

            showAlert("success", "Logged in successfully! Redirecting...");
            setTimeout(() => { window.location.href = next; }, 600);
        });

        forgotBtn.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            if (!email) {
                showAlert("error", "Enter your email above first, then press Forgot password.");
                emailInput.focus();
                return;
            }

            forgotBtn.disabled = true;
            forgotBtn.textContent = "Sending...";

            // The reset link in the email must open our reset-password page.
            const redirectTo = new URL("reset-password.html", window.location.href).href;
            const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });

            if (error) {
                showAlert("error", friendlyAuthError(error.message));
                forgotBtn.disabled = false;
                forgotBtn.textContent = "Forgot password?";
            } else {
                showAlert("success", "If an account exists for this email, a reset link has been sent. Please check your inbox and spam folder.");
                // Short pause before allowing another request (avoids email rate limits)
                setTimeout(() => {
                    forgotBtn.disabled = false;
                    forgotBtn.textContent = "Forgot password?";
                }, 30000);
            }
        });
    </script>
</body>
</html>
